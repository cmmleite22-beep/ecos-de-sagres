<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="mobile-web-app-capable" content="yes">
<title>Fúria Atlântica — Comando</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
<link rel="stylesheet" href="comando.css">
</head>
<body>
<!-- 1: entrar -->
<section id="s-join" class="screen">
  <h1>FÚRIA <span>ATLÂNTICA</span></h1>
  <p class="sub">Comando de luta</p>
  <label>O teu nome <input id="name" maxlength="12" autocomplete="nickname" placeholder="Jogador"></label>
  <div class="row" id="code-row">
    <label class="code">Código da sala <input id="code" maxlength="4" autocapitalize="characters" placeholder="ABCD"></label>
    <button id="btn-join" class="primary">Entrar</button>
  </div>
  <button id="btn-cast" class="cast hidden">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2a9 9 0 0 1 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
    Ligar ao Chromecast
  </button>
  <p id="join-err" class="err"></p>
  <p id="cast-state" class="hint"></p>
</section>

<!-- 2: escolher lutador -->
<section id="s-select" class="screen hidden">
  <h2>Escolhe o teu lutador</h2>
  <div id="roster"></div>
  <div class="stage-pick">
    <button id="st-prev" class="mini">‹</button>
    <span>Cenário: <b id="st-name">—</b></span>
    <button id="st-next" class="mini">›</button>
  </div>
  <button id="btn-fight" class="primary big">LUTAR!</button>
  <p id="queue-info" class="hint"></p>
  <p id="lobby-list" class="hint"></p>
</section>

<!-- 3: comando -->
<section id="s-pad" class="screen hidden">
  <div id="topbar">
    <span id="me"></span>
    <div class="bars">
      <div id="hpbar"><div></div></div>
      <div id="meterbar"><div></div></div>
    </div>
    <span id="rounds"></span>
    <span id="vs"></span>
    <span id="lat"></span>
  </div>
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div><i class="ar u">▲</i><i class="ar d">▼</i><i class="ar l">◀</i><i class="ar r">▶</i></div>
    <span class="zlabel">▲ saltar · ▼ baixar · ◀ ▶ andar</span></div>
  <div id="buttons">
    <button class="pad b-punch" data-b="1">SOCO</button>
    <button class="pad b-kick" data-b="2">PONTAPÉ</button>
    <button class="pad b-block" data-b="8">DEFESA</button>
    <button class="pad b-special" data-b="4">ESPECIAL</button>
    <button class="pad b-super" data-b="16">SUPER</button>
  </div>
  <p id="tip">▼ + ESPECIAL = segundo golpe especial · ▼ + DEFESA = defender em baixo</p>
  <div id="watch" class="hidden"></div>
  <div id="rotate">Roda o telemóvel na horizontal ↻</div>
</section>

<div id="result" class="hidden"><h1 id="res-title"></h1><p id="res-sub"></p></div>
<div id="overlay" class="hidden"></div>
<script type="module" src="comando.js"></script>
</body>
</html>
