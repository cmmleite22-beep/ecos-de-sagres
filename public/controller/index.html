<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16120c">
<meta name="mobile-web-app-capable" content="yes">
<title>Ecos de Sagres — Comando</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="controller.css">
</head>
<body>
<!-- Ecrã 1: entrar -->
<section id="s-join" class="screen">
  <h1>ECOS DE SAGRES</h1>
  <p class="sub">Comando de jogo</p>
  <label>O teu nome <input id="name" maxlength="12" autocomplete="nickname" placeholder="Jogador"></label>
  <div class="chars" id="chars"></div>
  <div class="row">
    <label class="code">Código da sala <input id="code" maxlength="4" autocapitalize="characters" placeholder="ABCD"></label>
    <button id="btn-join" class="primary">Entrar</button>
  </div>
  <button id="btn-cast" class="cast hidden">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2a9 9 0 0 1 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
    Ligar ao Chromecast
  </button>
  <p id="join-err" class="err"></p>
  <p id="cast-state" class="hint"></p>
</section>

<!-- Ecrã 2: lobby -->
<section id="s-lobby" class="screen hidden">
  <h2>Escolhe a tua personagem</h2>
  <div class="chars" id="chars2"></div>
  <p id="lobby-list"></p>
  <button id="btn-start" class="primary big">COMEÇAR</button>
  <p class="hint">Qualquer jogador pode começar. Podem entrar mais amigos a meio.</p>
</section>

<!-- Ecrã 3: comando (primeira pessoa) -->
<section id="s-pad" class="screen hidden">
  <div id="topbar">
    <span id="me"></span>
    <div id="hpbar"><div></div></div>
    <span id="rel">◆ 0</span>
    <button id="btn-sens" class="mini">Mira 1×</button>
    <span id="lat"></span>
  </div>
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div><span class="zlabel">mover</span></div>
  <div id="look-zone"><span class="zlabel">arrasta para olhar / apontar</span></div>
  <div id="buttons">
    <button class="pad b-fire" data-b="8">FOGO</button>
    <button class="pad b-jump" data-b="1">SALTAR</button>
    <button class="pad b-run" data-b="2">CORRER</button>
    <button class="pad b-act" data-b="4">AÇÃO</button>
  </div>
  <div id="rotate">Roda o telemóvel na horizontal ↻</div>
</section>

<div id="overlay" class="hidden"></div>
<script type="module" src="controller.js"></script>
</body>
</html>
