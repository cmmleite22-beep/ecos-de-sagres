# Compila a app nativa para Google TV / Android TV (Godot) e publica o APK numa release.
name: App Google TV (APK)

on:
  workflow_dispatch:
  push:
    branches: [main, godot-tv, 'tv-*']
    paths:
      - 'godot-tv/**'
      - 'public/controller/**'
      - 'public/shared/**'
      - '.github/workflows/android-tv.yml'

permissions:
  contents: write

env:
  GODOT_VERSION: '4.3'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot e modelos de exportação
        run: |
          set -e
          cd /tmp
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j tpl.tpz 'templates/android_*' 'templates/version.txt' -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Comando do telemóvel e texturas CC0
        run: |
          python3 godot-tv/sync_web.py
          python3 godot-tv/fetch_assets.py || echo "sem texturas fotográficas: usa as procedurais"

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/tv.keystore
          else
            echo "Sem segredo ANDROID_KEYSTORE_B64: a gerar uma chave nova (para atualizar, desinstala a versão anterior)"
            keytool -genkeypair -keystore /tmp/tv.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ecos de Sagres,O=Ecos,C=PT"
          fi
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            mkdir -p ~/.config/godot
            cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/tv.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
            sed -i 's/^          //' ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Importar e exportar o APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/tv.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          set -e
          cd godot-tv
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-release "Android TV" build/ecos-de-sagres-tv.apk
          ls -la build

      - name: Capturas de ecrã (software)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          mkdir -p /tmp/shots
          cd godot-tv
          xvfb-run -s "-screen 0 1920x1080x24" timeout 1500 godot --rendering-driver opengl3 --resolution 1280x720 -s tests/drive.gd -- /tmp/shots 2 || true
          ls /tmp/shots

      - uses: actions/upload-artifact@v4
        with:
          name: ecos-de-sagres-tv
          path: |
            godot-tv/build/*.apk
            /tmp/shots/*.jpg

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="tv-${GITHUB_REF_NAME}"
          NOTES="App para Google TV / Android TV, compilada a partir de ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Instruções em godot-tv/LEIA-ME.md."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          FILES="godot-tv/build/ecos-de-sagres-tv.apk"
          [ -f godot-tv/assets/polyhaven/CREDITOS.txt ] && cp godot-tv/assets/polyhaven/CREDITOS.txt /tmp/CREDITOS-texturas.txt && FILES="$FILES /tmp/CREDITOS-texturas.txt"
          for s in /tmp/shots/*.jpg; do [ -f "$s" ] && FILES="$FILES $s"; done
          gh release create "$TAG" $FILES --target "$GITHUB_SHA" --prerelease --title "Ecos de Sagres — Google TV (${GITHUB_REF_NAME})" --notes "$NOTES"
