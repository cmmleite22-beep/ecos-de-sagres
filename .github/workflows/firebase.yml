# Publica o site (jogos para a TV/Chromecast e comandos) no Firebase Hosting, grátis e na raiz do domínio.
# Precisa de: segredo FIREBASE_SERVICE_ACCOUNT (chave JSON da conta de serviço) e variável FIREBASE_PROJECT_ID.
# Sem eles, este passo é saltado e o site continua só no GitHub Pages.
name: Publicar no Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração
        id: cfg
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$SA" ] && [ -n "$PID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::Firebase ainda não configurado (falta FIREBASE_SERVICE_ACCOUNT ou FIREBASE_PROJECT_ID). Ver docs/ANDROID-RISCA.md."; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok
        with:
          node-version: 20
      - name: Montar o site estático
        if: steps.cfg.outputs.ok
        run: npm ci && npm run build:site
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.cfg.outputs.ok
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
