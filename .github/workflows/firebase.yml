# Publica o site (jogos para a TV/Chromecast e comandos) no Firebase Hosting, grátis e na raiz do domínio:
# https://risca-e-arrisca.web.app
# Sem chave secreta: o GitHub prova quem é ao Google (Workload Identity Federation), e só este repositório
# pode usar a conta de serviço github-deploy, que só tem permissões de Firebase Hosting.
name: Publicar no Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: firebase
  cancel-in-progress: true
env:
  FIREBASE_PROJECT: risca-e-arrisca
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar o site estático
        run: npm ci && npm run build:site
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1027394540234/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deploy@risca-e-arrisca.iam.gserviceaccount.com
      - name: Publicar
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive

  # Função «anfitriao» (compras na app e salas grátis do Risca e Arrisca). Só corre depois de o projeto Firebase
  # passar ao plano Blaze e de se correr scripts/configurar-pagamentos.sh uma vez; depois cria-se a variável
  # do repositório RISCA_FUNCOES = 1 (Settings → Secrets and variables → Actions → Variables).
  funcoes:
    if: vars.RISCA_FUNCOES == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar as regras
        run: node tests/risca-anfitriao-logica.mjs
      - name: Instalar
        run: cd functions && npm ci
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1027394540234/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deploy@risca-e-arrisca.iam.gserviceaccount.com
      - name: Publicar a função e as regras do Firestore
        run: npx --yes firebase-tools@14 deploy --only functions,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive --force
